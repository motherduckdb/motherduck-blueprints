name: Release MotherDuck Blueprints

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and Build Release
    if: github.repository == 'motherduckdb/motherduck-blueprints'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check release version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
            echo "EXPECTED_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            ./scripts/check-release-version.sh
          fi

      - name: Build and smoke test package
        run: ./scripts/package-smoke-test.sh dist

      - name: Generate dependency SBOM
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name 'md_blueprints-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "${wheel}[deploy]" cyclonedx-bom==7.3.1
          cyclonedx-py environment "$(command -v python)" \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-file md-blueprints.cdx.json

      - name: Smoke test local action
        uses: ./
        with:
          command: validate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: md-blueprints-dist
          path: |
            dist/*
            md-blueprints.cdx.json
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            md-blueprints.cdx.json

  release-preflight:
    name: Verify Release Setup and Tag
    needs: build
    if: github.repository == 'motherduckdb/motherduck-blueprints' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latest: ${{ steps.order.outputs.latest }}
      latest-in-major: ${{ steps.order.outputs.latest-in-major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag ${GITHUB_REF_NAME} must point to a commit on origin/main." >&2
            exit 1
          }

      - name: Check external publishing setup
        env:
          TEMPLATE_PUSH_TOKEN: ${{ secrets.BLUEPRINTS_TEMPLATE_PUSH_TOKEN }}
          TEMPLATE_REPOSITORY: motherduckdb/blueprints-template
        run: ./scripts/check-release-external-setup.sh

      - name: Compare with published releases
        id: order
        run: |
          set -euo pipefail
          # A patch for an older line must not move the template default branch or the floating major tag back.
          stable="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
          major="$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1)"
          highest="$(printf '%s\n' "$stable" | tail -n 1)"
          highest_in_major="$(printf '%s\n' "$stable" | grep -E "^v${major}\." | tail -n 1)"
          latest=false
          latest_in_major=false
          [ "$highest" = "$GITHUB_REF_NAME" ] && latest=true
          [ "$highest_in_major" = "$GITHUB_REF_NAME" ] && latest_in_major=true
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "latest-in-major=${latest_in_major}" >> "$GITHUB_OUTPUT"
          echo "Highest release: ${highest}. Highest v${major} release: ${highest_in_major}."

  publish-template:
    name: Publish and Verify Generated Template
    needs:
      - build
      - release-preflight
    if: github.repository == 'motherduckdb/motherduck-blueprints' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: motherduck-release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: md-blueprints-dist
          path: release-artifacts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Generate template repository from release wheel
        run: |
          set -euo pipefail
          python -m pip install release-artifacts/dist/md_blueprints-*.whl
          md-blueprints init generated-template
          # Catch a broken template before customers can create repositories from it.
          cd generated-template
          md-blueprints validate
          md-blueprints changed --all --json

      - name: Publish generated template repository
        id: template
        env:
          TEMPLATE_PUSH_TOKEN: ${{ secrets.BLUEPRINTS_TEMPLATE_PUSH_TOKEN }}
          TEMPLATE_REPOSITORY: motherduckdb/blueprints-template
          LATEST: ${{ needs.release-preflight.outputs.latest }}
        run: |
          set -euo pipefail
          # Pass the token as a step-scoped HTTP header so it is not stored in
          # the clone URL, .git/config, or process arguments.
          auth="$(printf 'x-access-token:%s' "$TEMPLATE_PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git clone "https://github.com/${TEMPLATE_REPOSITORY}.git" template-checkout
          cd template-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R ../generated-template/. .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Generate template for ${GITHUB_REF_NAME}"
          fi

          if existing="$(git rev-parse -q --verify "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null)" && [ "$existing" != "$(git rev-parse HEAD)" ]; then
            echo "Template tag ${GITHUB_REF_NAME} already points to a different commit." >&2
            exit 1
          fi
          git tag "${GITHUB_REF_NAME}" 2>/dev/null || true
          if [ "$LATEST" = "true" ]; then
            git push origin HEAD:main
          else
            echo "::notice title=Template main unchanged::${GITHUB_REF_NAME} is older than the highest release, so only its tag is published."
          fi
          git push origin "refs/tags/${GITHUB_REF_NAME}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify generated template workflow
        # Only a push to the template default branch starts its workflow.
        if: needs.release-preflight.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.BLUEPRINTS_TEMPLATE_PUSH_TOKEN }}
          TEMPLATE_REPOSITORY: motherduckdb/blueprints-template
          TEMPLATE_COMMIT: ${{ steps.template.outputs.commit }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list -R "$TEMPLATE_REPOSITORY" --commit "$TEMPLATE_COMMIT" --workflow deploy_blueprints.yaml --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "No generated-template validation run appeared for ${TEMPLATE_COMMIT}." >&2
            exit 1
          fi
          gh run watch "$run_id" -R "$TEMPLATE_REPOSITORY" --exit-status

      - name: Publish template release notes
        env:
          GH_TOKEN: ${{ secrets.BLUEPRINTS_TEMPLATE_PUSH_TOKEN }}
          TEMPLATE_REPOSITORY: motherduckdb/blueprints-template
          LATEST: ${{ needs.release-preflight.outputs.latest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" -R "$TEMPLATE_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable template release ${tag} already exists."
          else
            gh release create "$tag" -R "$TEMPLATE_REPOSITORY" --verify-tag --title "$tag" \
              --latest="$LATEST" --notes-file release-artifacts/RELEASE_NOTES.md
          fi

  finalize-release:
    name: Publish GitHub Release and Action Alias
    needs:
      - build
      - release-preflight
      - publish-template
    if: github.repository == 'motherduckdb/motherduck-blueprints' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: md-blueprints-dist
          path: release-artifacts

      - name: Publish GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.release-preflight.outputs.latest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable GitHub Release ${tag} already exists."
          else
            gh release create "$tag" release-artifacts/dist/* release-artifacts/md-blueprints.cdx.json \
              --verify-tag \
              --title "$tag" \
              --latest="$LATEST" \
              --notes-file release-artifacts/RELEASE_NOTES.md
          fi

      - name: Update floating major tag
        if: needs.release-preflight.outputs.latest-in-major == 'true'
        run: |
          set -euo pipefail
          major="v$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "$major"

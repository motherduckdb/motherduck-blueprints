name: Blueprints Doctor

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
# Generated jobs: edit reusable workflows, then run make sync-workflows.

jobs:
  doctor:
    name: Check Blueprint Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run blueprints doctor
        id: doctor
        continue-on-error: true
        uses: ./
        with:
          python-version: "3.11"
          command: doctor
          args: --format github-summary --check-updates

      - name: Reconcile upgrade issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOCTOR_OUTPUT: ${{ steps.doctor.outputs.stdout }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
        with:
          script: |
            const title = 'MotherDuck Blueprints upgrade needed';
            const marker = '<!-- motherduck-blueprints-upgrade-needed -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const notice = `\n\n_Output truncated. See the [workflow run](${runUrl}) for the full report._`;
            let report = process.env.DOCTOR_OUTPUT || 'The scheduled MotherDuck Blueprints doctor check failed. Bump the pinned action and run md-blueprints doctor locally.';
            // GitHub rejects issue bodies over 65536 characters.
            const limit = 65000 - marker.length - notice.length;
            if (report.length > limit) {
              report = report.slice(0, limit) + notice;
            }
            const body = `${marker}\n${report}`.replace(/^ +/gm, '');
            const failed = process.env.DOCTOR_OUTCOME === 'failure';

            let existing;
            for await (const { data: issues } of github.paginate.iterator(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            })) {
              existing = issues.find(issue => !issue.pull_request && issue.title === title);
              if (existing) break;
            }
            if (failed && existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open',
              });
            } else if (failed) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            } else if (existing?.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

name: MotherDuck Blueprints
description: Install and run the versioned MotherDuck Blueprints CLI.
author: MotherDuck

branding:
  icon: layers
  color: yellow

inputs:
  command:
    description: CLI command to run, such as guides, validate, verify, import, plan, deploy, cleanup, doctor, or upgrade.
    required: false
    default: validate
  target:
    description: Deployment target (preview, prod, or a configured staging target).
    required: false
  branch:
    description: Branch name for preview resources. Required when target is preview.
    required: false
  blueprints:
    description: Comma-separated package names. Leave empty to select all packages.
    required: false
  root:
    description: Project directory relative to the checkout. Guides also supports plain SQL and dbt repositories.
    required: false
  dbt:
    description: Optional dbt project directory or dbt_project.yml path for command guides, relative to the checkout.
    required: false
  args:
    description: Advanced CLI arguments. Named inputs take precedence over matching flags.
    required: false
    default: ""
  python-version:
    description: Python version used to install md-blueprints.
    required: false
    default: "3.11"
  verify-after-deploy:
    description: Verify live identities, dependencies, and Dive status after deployment. Pre-deploy validation always runs.
    required: false
    default: "true"

outputs:
  stdout:
    description: Raw CLI stdout. For guides, use stdout-file instead to avoid logging context or exceeding output limits.
    value: ${{ steps.run.outputs.stdout }}
  stdout-file:
    description: Absolute path to the CLI output file on the current runner. Upload or consume it in a later step.
    value: ${{ steps.run.outputs.stdout-file }}
  python:
    description: Python interpreter of the action's isolated md-blueprints environment. Use it for later steps that import md_blueprints or PyYAML.
    value: ${{ steps.install.outputs.python }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install md-blueprints
      id: install
      shell: bash
      env:
        MD_BLUEPRINTS_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        # Install into a job-scoped virtual environment so later steps and
        # persistent runners keep an unmodified setup-python interpreter.
        extra=""
        case "$MD_BLUEPRINTS_COMMAND" in
          plan|deploy|cleanup|verify) extra="[deploy]" ;;
        esac
        python_key="$(python -c 'import sys; print(sys.executable, sys.version)')"
        env_key="$(printf '%s-%s' "$GITHUB_ACTION_PATH" "$python_key" | cksum | awk '{print $1}')"
        env_root="${RUNNER_TEMP}/md-blueprints-action/${env_key}"
        venv="${env_root}/venv"
        link_dir="${env_root}/bin"
        mkdir -p "$link_dir"
        if [ ! -d "$venv" ]; then
          python -m venv "$venv"
        fi
        venv_bin="${venv}/bin"
        if [ -d "${venv}/Scripts" ]; then
          venv_bin="${venv}/Scripts"
        fi
        venv_python="${venv_bin}/python"
        marker="${env_root}/installed${extra:+-deploy}"
        if [ -f "$marker" ] || { [ -z "$extra" ] && [ -f "${env_root}/installed-deploy" ]; }; then
          echo "md-blueprints dependencies already installed for this action checkout."
        else
          constraints="$GITHUB_ACTION_PATH/constraints/action.txt"
          "$venv_python" -m pip install --constraint "$constraints" pip setuptools wheel
          "$venv_python" -m pip install --no-build-isolation --constraint "$constraints" "${GITHUB_ACTION_PATH}${extra}"
          touch "$marker"
        fi
        # Expose only the md-blueprints entry point, not the environment's python or pip.
        for name in md-blueprints md-blueprints.exe; do
          if [ -e "${venv_bin}/${name}" ]; then
            ln -sf "${venv_bin}/${name}" "${link_dir}/${name}"
          fi
        done
        echo "$link_dir" >> "$GITHUB_PATH"
        {
          echo "bin=${venv_bin}/md-blueprints"
          echo "python=${venv_python}"
        } >> "$GITHUB_OUTPUT"

    - name: Install MotherDuck CLI
      if: inputs.command == 'import'
      shell: bash
      env:
        MD_BLUEPRINTS_BIN: ${{ steps.install.outputs.bin }}
      run: '"$MD_BLUEPRINTS_BIN" install-cli'

    - name: Run md-blueprints
      id: run
      shell: bash
      env:
        MD_BLUEPRINTS_SQL_BACKEND: ${{ inputs.command == 'import' && 'motherduck' || 'duckdb' }}
        MOTHERDUCK_HOME: ${{ runner.temp }}/md-blueprints-motherduck
        MD_BLUEPRINTS_COMMAND: ${{ inputs.command }}
        MD_BLUEPRINTS_BIN: ${{ steps.install.outputs.bin }}
        MD_BLUEPRINTS_ARGS: ${{ inputs.args }}
        MD_BLUEPRINTS_TARGET: ${{ inputs.target }}
        MD_BLUEPRINTS_BRANCH: ${{ inputs.branch }}
        MD_BLUEPRINTS_BLUEPRINTS: ${{ inputs.blueprints }}
        MD_BLUEPRINTS_ROOT: ${{ inputs.root }}
        MD_BLUEPRINTS_DBT: ${{ inputs.dbt }}
        MD_BLUEPRINTS_VERIFY_AFTER_DEPLOY: ${{ inputs.verify-after-deploy }}
      run: |
        set -euo pipefail
        stdout_dir="$(mktemp -d "${RUNNER_TEMP}/md-blueprints.XXXXXX")"
        stdout_file="$stdout_dir/stdout.txt"
        if [ "$MD_BLUEPRINTS_COMMAND" = "guides" ]; then
          stdout_file="$stdout_dir/guide-context.md"
        fi
        : > "$stdout_file"
        export MD_BLUEPRINTS_STDOUT_FILE="$stdout_file"
        set +e
        python - <<'PY'
        import os
        import shlex
        import subprocess
        import sys
        from pathlib import Path

        command = os.environ["MD_BLUEPRINTS_COMMAND"]
        argv = [
            os.environ.get("MD_BLUEPRINTS_BIN") or "md-blueprints",
            command,
            *shlex.split(os.environ.get("MD_BLUEPRINTS_ARGS", "")),
        ]
        for name in ("root", "target", "branch", "blueprints", "dbt"):
            value = os.environ.get(f"MD_BLUEPRINTS_{name.upper()}", "")
            if value:
                argv.append(f"--{name}={value}")
        if command == "deploy":
            verify = os.environ.get("MD_BLUEPRINTS_VERIFY_AFTER_DEPLOY", "true").lower()
            if verify not in {"true", "false"}:
                raise SystemExit("verify-after-deploy must be true or false")
            argv.append("--verify" if verify == "true" else "--skip-verification")
        output = Path(os.environ["MD_BLUEPRINTS_STDOUT_FILE"])
        with output.open("wb") as stream:
            if command == "guides":
                # Guide context stays out of logs and is only written to the file.
                returncode = subprocess.run(argv, stdout=stream, check=False).returncode
            else:
                # Stream output live so logs survive cancellation and timeouts,
                # while keeping a copy for the stdout and stdout-file outputs.
                env = {**os.environ, "PYTHONUNBUFFERED": "1"}
                with subprocess.Popen(argv, stdout=subprocess.PIPE, env=env) as process:
                    pipe = process.stdout
                    assert pipe is not None
                    for chunk in iter(lambda: pipe.read1(65536), b""):
                        stream.write(chunk)
                        stream.flush()
                        sys.stdout.buffer.write(chunk)
                        sys.stdout.buffer.flush()
                returncode = process.returncode
        raise SystemExit(returncode)
        PY
        status="$?"
        set -e
        {
          echo "stdout-file=$stdout_file"
          if [ "$MD_BLUEPRINTS_COMMAND" != "guides" ]; then
            delimiter="MD_BLUEPRINTS_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
            echo "stdout<<$delimiter"
            cat "$stdout_file"
            echo
            echo "$delimiter"
          fi
        } >> "$GITHUB_OUTPUT"
        exit "$status"

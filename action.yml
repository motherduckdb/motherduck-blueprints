name: MotherDuck Blueprints
description: Install and run the versioned MotherDuck Blueprints CLI.
author: MotherDuck

branding:
  icon: layers
  color: yellow

inputs:
  command:
    description: CLI command to run, such as validate, verify, import, plan, deploy, cleanup, doctor, or upgrade.
    required: false
    default: validate
  target:
    description: Deployment target (preview, prod, or a configured staging target).
    required: false
  branch:
    description: Branch name for preview resources. Required when target is preview.
    required: false
  blueprints:
    description: Comma-separated package names. Leave empty to select all packages.
    required: false
  root:
    description: Directory containing motherduck.yml, relative to the checkout.
    required: false
  args:
    description: Advanced CLI arguments. Named inputs take precedence over matching flags.
    required: false
    default: ""
  python-version:
    description: Python version used to install md-blueprints.
    required: false
    default: "3.11"
  verify-after-deploy:
    description: Verify live identities, dependencies, and Dive status after deployment. Pre-deploy validation always runs.
    required: false
    default: "true"

outputs:
  stdout:
    description: Raw CLI stdout.
    value: ${{ steps.run.outputs.stdout }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install md-blueprints
      shell: bash
      env:
        MD_BLUEPRINTS_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        install_target="$GITHUB_ACTION_PATH"
        case "$MD_BLUEPRINTS_COMMAND" in
          plan|deploy|cleanup|verify) install_target="${GITHUB_ACTION_PATH}[deploy]" ;;
        esac
        python_key="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
        action_key="$(printf '%s-%s' "$install_target" "$python_key" | cksum | awk '{print $1}')"
        marker_dir="${RUNNER_TEMP}/md-blueprints-action"
        marker="${marker_dir}/${action_key}"
        mkdir -p "$marker_dir"
        if [ -f "$marker" ]; then
          echo "md-blueprints dependencies already installed for this action checkout."
          exit 0
        fi

        constraints="$GITHUB_ACTION_PATH/constraints/action.txt"
        python -m pip install --constraint "$constraints" pip setuptools wheel
        python -m pip install --no-build-isolation --constraint "$constraints" "$install_target"
        touch "$marker"

    - name: Install MotherDuck CLI
      if: inputs.command == 'import'
      shell: bash
      run: md-blueprints install-cli

    - name: Run md-blueprints
      id: run
      shell: bash
      env:
        MD_BLUEPRINTS_SQL_BACKEND: ${{ inputs.command == 'import' && 'motherduck' || 'duckdb' }}
        MOTHERDUCK_HOME: ${{ runner.temp }}/md-blueprints-motherduck
        MD_BLUEPRINTS_COMMAND: ${{ inputs.command }}
        MD_BLUEPRINTS_ARGS: ${{ inputs.args }}
        MD_BLUEPRINTS_TARGET: ${{ inputs.target }}
        MD_BLUEPRINTS_BRANCH: ${{ inputs.branch }}
        MD_BLUEPRINTS_BLUEPRINTS: ${{ inputs.blueprints }}
        MD_BLUEPRINTS_ROOT: ${{ inputs.root }}
        MD_BLUEPRINTS_VERIFY_AFTER_DEPLOY: ${{ inputs.verify-after-deploy }}
      run: |
        set -euo pipefail
        stdout_file="$(mktemp)"
        set +e
        python - <<'PY' | tee "$stdout_file"
        import os
        import shlex
        import subprocess
        import sys

        argv = [
            "md-blueprints",
            os.environ["MD_BLUEPRINTS_COMMAND"],
            *shlex.split(os.environ.get("MD_BLUEPRINTS_ARGS", "")),
        ]
        for name in ("root", "target", "branch", "blueprints"):
            value = os.environ.get(f"MD_BLUEPRINTS_{name.upper()}", "")
            if value:
                argv.append(f"--{name}={value}")
        if os.environ["MD_BLUEPRINTS_COMMAND"] == "deploy":
            verify = os.environ.get("MD_BLUEPRINTS_VERIFY_AFTER_DEPLOY", "true").lower()
            if verify not in {"true", "false"}:
                raise SystemExit("verify-after-deploy must be true or false")
            argv.append("--verify" if verify == "true" else "--skip-verification")
        completed = subprocess.run(argv, text=True, stdout=subprocess.PIPE, check=False)
        sys.stdout.write(completed.stdout)
        raise SystemExit(completed.returncode)
        PY
        status="${PIPESTATUS[0]}"
        set -e
        {
          delimiter="MD_BLUEPRINTS_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          echo "stdout<<$delimiter"
          cat "$stdout_file"
          echo
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
        exit "$status"

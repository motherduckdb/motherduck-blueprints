name: MotherDuck Blueprints
description: Install and run the versioned MotherDuck Blueprints CLI.
author: MotherDuck

branding:
  icon: layers
  color: yellow

inputs:
  command:
    description: CLI command to run, such as init, validate, render, changed, plan, deploy, cleanup, doctor, or migrate.
    required: true
    default: validate
  args:
    description: Additional command arguments.
    required: false
    default: ""
  python-version:
    description: Python version used to install md-blueprints.
    required: false
    default: "3.11"

outputs:
  stdout:
    description: Raw CLI stdout.
    value: ${{ steps.run.outputs.stdout }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install md-blueprints
      shell: bash
      env:
        MD_BLUEPRINTS_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        install_target="$GITHUB_ACTION_PATH"
        install_mode="base"
        case "$MD_BLUEPRINTS_COMMAND" in
          plan|deploy|cleanup)
            install_target="${GITHUB_ACTION_PATH}[deploy]"
            install_mode="deploy"
            ;;
        esac
        python_key="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
        action_key="$(printf '%s-%s' "$GITHUB_ACTION_PATH" "$python_key" | cksum | awk '{print $1}')"
        marker_dir="${RUNNER_TEMP}/md-blueprints-action"
        base_marker="${marker_dir}/${action_key}-base"
        deploy_marker="${marker_dir}/${action_key}-deploy"
        mkdir -p "$marker_dir"
        if [ -f "$deploy_marker" ] || { [ "$install_mode" = "base" ] && [ -f "$base_marker" ]; }; then
          echo "md-blueprints dependencies already installed for this action checkout."
          exit 0
        fi

        constraints="$GITHUB_ACTION_PATH/constraints/action.txt"
        python -m pip install --constraint "$constraints" pip setuptools wheel
        python -m pip install --no-build-isolation --constraint "$constraints" "$install_target"
        touch "$marker_dir/${action_key}-${install_mode}"

    - name: Run md-blueprints
      id: run
      shell: bash
      env:
        MD_BLUEPRINTS_COMMAND: ${{ inputs.command }}
        MD_BLUEPRINTS_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        stdout_file="$(mktemp)"
        set +e
        python - <<'PY' | tee "$stdout_file"
        import os
        import shlex
        import subprocess
        import sys

        argv = [
            "md-blueprints",
            os.environ["MD_BLUEPRINTS_COMMAND"],
            *shlex.split(os.environ.get("MD_BLUEPRINTS_ARGS", "")),
        ]
        completed = subprocess.run(argv, text=True, stdout=subprocess.PIPE, check=False)
        sys.stdout.write(completed.stdout)
        raise SystemExit(completed.returncode)
        PY
        status="${PIPESTATUS[0]}"
        set -e
        {
          echo "stdout<<MD_BLUEPRINTS_EOF"
          cat "$stdout_file"
          echo "MD_BLUEPRINTS_EOF"
        } >> "$GITHUB_OUTPUT"
        exit "$status"

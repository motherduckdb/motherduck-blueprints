version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Blueprints Doctor coordinates this action with Makefile's exact CLI pin.
      - dependency-name: motherduckdb/motherduck-blueprints
  - package-ecosystem: npm
    directory: /.dive-preview
    schedule:
      interval: weekly
    ignore:
      # Pinned to the versions production Dives load; update them only when MotherDuck does.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: d3
      - dependency-name: lucide-react
      - dependency-name: recharts

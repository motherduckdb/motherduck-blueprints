[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-blueprints"
version = "0.4.1"
description = "Versioned MotherDuck Blueprints CLI for validation, planning, deployment, cleanup, and migrations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MotherDuck" }]
maintainers = [{ name = "MotherDuck", email = "support@motherduck.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "packaging>=24.0",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
deploy = [
  "duckdb>=1.1,<1.5.5",
  "pytz>=2026.3.post1",
]
dev = [
  "duckdb>=1.1,<1.5.5",
  "mypy>=1.10",
  "pip-audit>=2.10",
  "pytest>=8.0",
  "ruff>=0.16",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/motherduckdb/motherduck-blueprints"
Documentation = "https://github.com/motherduckdb/motherduck-blueprints#readme"
Issues = "https://github.com/motherduckdb/motherduck-blueprints/issues"
Changelog = "https://github.com/motherduckdb/motherduck-blueprints/blob/main/CHANGELOG.md"

[project.scripts]
md-blueprints = "md_blueprints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md_blueprints = [
  "schemas/**/*.json",
  "template_repo/**/*",
  "template_repo/.dive-preview/.env.example",
  "template_repo/.dive-preview/**/*",
  "template_repo/.github/**/*",
  "template_repo/.gitignore",
]

[tool.mypy]
exclude = [
  "src/md_blueprints/template_repo/",
  "tests/fixtures/",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
